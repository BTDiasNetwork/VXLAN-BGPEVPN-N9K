---
- name: Provision VXLAN EVPN Tenant
  hosts: a-leafs
  gather_facts: false

  collections:
    - cisco.nxos

  tasks:

    ####################################################################
    # FEATURES
    ####################################################################

    - name: Enable required features
      cisco.nxos.nxos_config:
        lines:
          - feature nv overlay
          - feature vn-segment
          - feature bgp
          - feature interface-vlan


    ####################################################################
    # VRF / L3VNI
    ####################################################################

    - name: Configure tenant VRF
      cisco.nxos.nxos_config:
        parents:
          - "vrf context {{ vrf }}"
        lines:
          - "vni {{ l3vni }}"
      tags: deploy


    ####################################################################
    # VLAN / L2VNI
    ####################################################################

    - name: Configure tenant VLAN
      cisco.nxos.nxos_config:
        parents:
          - "vlan {{ vlan_id }}"
        lines:
          - "name {{ vlan_name }}"
          - "vn-segment {{ l2vni }}"
      tags: deploy


    ####################################################################
    # SVI
    ####################################################################

    - name: Configure tenant SVI
      cisco.nxos.nxos_config:
        parents:
          - "interface Vlan{{ vlan_id }}"
        lines:
          - "description SVI-{{ name }}"
          - "vrf member {{ vrf }}"
          - "ip address {{ svi_ip }}"
          - "no shutdown"
          - "fabric forwarding mode anycast-gateway"
      tags: deploy


    ####################################################################
    # NVE
    ####################################################################

    - name: Configure NVE1
      cisco.nxos.nxos_config:
        parents:
          - "interface nve1"
        lines:
          - "no shutdown"
          - "source-interface loopback1"
          - "host-reachability protocol bgp"
      tags: deploy


    ####################################################################
    # L2VNI
    ####################################################################

    - name: Configure L2VNI with multicast replication
      cisco.nxos.nxos_config:
        parents:
          - "interface nve1"
          - "member vni {{ l2vni }}"
        lines:
          - "mcast-group {{ multicast_group }}"
      tags: deploy


    ####################################################################
    # L3VNI
    ####################################################################

    - name: Configure L3VNI
      cisco.nxos.nxos_config:
        parents:
          - "interface nve1"
        lines:
          - "member vni {{ l3vni }} associate-vrf"
      tags: deploy


    ####################################################################
    # BGP EVPN - GLOBAL
    ####################################################################

    - name: Enable BGP EVPN address-family
      cisco.nxos.nxos_config:
        parents:
          - "router bgp {{ bgp_as }}"
          - "address-family l2vpn evpn"
      tags: deploy


    ####################################################################
    # EVPN L2VNI
    ####################################################################

    - name: Configure EVPN L2VNI
      cisco.nxos.nxos_config:
        parents:
          - "router bgp {{ bgp_as }}"
          - "address-family l2vpn evpn"
          - "evpn"
          - "vni {{ l2vni }} l2"
        lines:
          - "rd auto"
          - "route-target import auto"
          - "route-target export auto"
      tags: deploy


    ####################################################################
    # BGP VRF
    ####################################################################

    - name: Configure BGP tenant VRF
      cisco.nxos.nxos_config:
        parents:
          - "router bgp {{ bgp_as }}"
          - "vrf {{ vrf }}"
          - "address-family ipv4 unicast"
        lines:
          - "advertise l2vpn evpn"
      tags: deploy